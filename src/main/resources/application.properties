spring.application.name=carpool-api
server.port=8080
# --- Database (PostgreSQL) ---
# Create the DB first: createdb carpool

spring.datasource.url=jdbc:postgresql://localhost:5432/carpool
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
# Override with a real 256-bit+ secret in production via env var JWT_SECRET
app.jwt.secret=8f3c9a7e2d1b6c5a4f8e9d0c7b2a1f6e3d8c5b9a2f7e4d1c6b3a8f5e2d9c
app.jwt.expiration-ms=86400000

# --- Google Sign-In ---
# Same OAuth client ID the frontend uses (VITE_GOOGLE_CLIENT_ID). The backend
# verifies every Google ID token was issued for this exact audience, so it
# must match on both sides. Override via env var GOOGLE_CLIENT_ID in prod.
app.google.client-id=147496769542-j20fvb3b9r2aqcdpv1gm9vv3tm910cuf.apps.googleusercontent.com

# --- CORS ---
#app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-origins=http://localhost:5173

# --- Platform commission ---
# Percentage of a ride's total price kept by the platform. Stored on each
# ride at creation time (so past rides keep the rate that applied then,
# even if this default changes later).
#app.commission.percent=${COMMISSION_PERCENT:10}
app.commission.percent=10

# --- Razorpay ---
# Get these from https://dashboard.razorpay.com/app/keys (use Test keys while
# developing). NEVER commit real keys — override via env vars in production.
# Webhook secret is set when you create the webhook in the Razorpay dashboard
# (Settings > Webhooks), pointing at POST /api/payments/webhook/razorpay.
# It's optional: without it, payments still work via the checkout-verify flow
# below, you just lose the extra safety net for payments where the browser
# tab closed before the frontend could call verify.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# --- Email (forgot-password OTP) ---
# Set app.mail.enabled=true and fill in real SMTP creds to actually send mail
# (e.g. a Gmail app password, SendGrid/SES SMTP relay). While disabled or
# unconfigured, OTP codes are just logged to the server console instead of
# emailed — handy for local dev without setting up SMTP.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@waypoint.app}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Password reset OTP ---
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}

